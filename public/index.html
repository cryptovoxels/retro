<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.min.js" as="script" />
    <link href="/69420-app.css" rel="stylesheet" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
    <!-- Scripts stay in head (defer) so document.body has no element children; app main.tsx hydrate() then client-renders. -->
    <script defer src="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.min.js"></script>
    <script defer src="/69420-app.js"></script>
  </head>
  <body></body>
</html>
