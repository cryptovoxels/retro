# Runs the two gates AGENTS.md already asks you to run before committing.
# Tests are not here yet: 7 files under test/src (terrain, ocean, pump,
# enviroments) fail on a clean checkout, so a test job would be red on arrival.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # engines.node in package.json, so this follows the repo
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit --project tsconfig.precommit.json

      - run: npx prettier --check .
