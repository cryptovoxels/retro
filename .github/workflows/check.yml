# Runs the gates AGENTS.md asks you to run before committing.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "t0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # engines.node in package.json, so this follows the repo
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # None of these three needs the others, so run them at once and pay for
      # the slowest instead of the sum. Buffered so the logs read one at a time.
      - run: |
          npx tsc --noEmit --project tsconfig.precommit.json >/tmp/tsc.log 2>&1 & a=$!
          npx prettier --check . >/tmp/fmt.log 2>&1 & b=$!
          pnpm test >/tmp/test.log 2>&1 & c=$!
          wait $a; ra=$?; wait $b; rb=$?; wait $c; rc=$?
          cat /tmp/tsc.log /tmp/fmt.log /tmp/test.log
          exit $(( ra | rb | rc ))

      # AGENTS.md: CI must stay under 60s or it may get deleted
      - if: always()
        run: |
          s=$(( $(date +%s) - t0 ))
          if [ "$s" -gt 60 ]; then
            echo "::warning::Warning, CI test took $((s / 60)):$(printf '%02d' $((s % 60))), ben may arbitrarily delete CI (see agents.md)"
          fi
